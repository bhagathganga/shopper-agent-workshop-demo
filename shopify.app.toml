# Extension-only app: no web backend, it just ships the theme app extension.
# `shopify app config link` (or the first `shopify app dev`) fills in client_id from the Partner Dashboard.
client_id = ""
name = "Canada Goose Shopper Agent"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
scopes = ""

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2025-10"

[build]
include_config_on_deploy = true
